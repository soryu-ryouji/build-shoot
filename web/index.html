<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>构筑枪械 Build Shoot</title>
<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #0b0d10;
	}
	body {
		display: flex;
		align-items: center;
		justify-content: center;
	}
	/* 横屏舞台始终铺满；不再把桌面端限制成竖屏窗口。 */
	#stage {
	    position: relative;
	    width: 100vw;
	    height: 100vh;
	}
	#rotate-hint {
	    display: none;
	    position: fixed;
	    inset: 0;
	    z-index: 2;
	    align-items: center;
	    justify-content: center;
	    flex-direction: column;
	    gap: 12px;
	    background: #14181c;
	    color: #ece9e1;
	    font: 600 20px/1.6 system-ui, sans-serif;
	    letter-spacing: 0.08em;
	    text-align: center;
	}
	#rotate-hint small {
	    color: #8f969b;
	    font-size: 13px;
	    font-weight: 400;
	}
	#rotate-hint .phone {
	    width: 48px;
	    height: 76px;
	    border: 2px solid #f1a33b;
	    border-radius: 7px;
	    transform: rotate(90deg);
	}
	@media (orientation: portrait) and (pointer: coarse) {
	    #rotate-hint { display: flex; }
	}
	iframe {
		display: block;
		width: 100%;
		height: 100%;
		border: 0;
		background: #0b0d10;
	}
</style>
</head>
<body>
	<div id="stage">
		<iframe src="app.html" title="构筑枪械 Build Shoot"
		        allow="fullscreen; gamepad; autoplay" allowfullscreen></iframe>
	</div>
</body>
</html>
