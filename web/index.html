<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>构筑枪械 Build Shoot</title>
<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #0b0d10;
	}
	body {
		display: flex;
		align-items: center;
		justify-content: center;
	}
	/* 手机上铺满；桌面横屏时收成 9:16 竖屏舞台，避免战斗区被上下裁掉 */
	#stage {
		position: relative;
		width: 100vw;
		height: 100vh;
	}
	@media (min-aspect-ratio: 3/5) {
		#stage {
			width: min(100vw, 56.25vh);
			height: 100vh;
			box-shadow: 0 0 64px rgba(0, 0, 0, 0.65);
		}
	}
	iframe {
		display: block;
		width: 100%;
		height: 100%;
		border: 0;
		background: #0b0d10;
	}
</style>
</head>
<body>
	<div id="stage">
		<iframe src="app.html" title="构筑枪械 Build Shoot"
		        allow="fullscreen; gamepad; autoplay" allowfullscreen></iframe>
	</div>
</body>
</html>
